<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}} — dependencies</title>
<style>{{STYLE}}</style>
</head>
<body>
<header id="bar">
  <h1 id="title"></h1>
  <div id="stats" aria-live="polite"></div>
  <div id="search-wrap">
    <input id="search" type="search" placeholder="Search modules  ( / )" autocomplete="off" spellcheck="false" aria-label="Search modules">
    <ul id="results" hidden></ul>
  </div>
  <div class="group">
    <label>Depth
      <select id="depth" aria-label="Expansion depth"></select>
    </label>
    <button id="expand-all" title="Expand every group">Expand all</button>
    <button id="collapse-all" title="Collapse to top level">Collapse all</button>
  </div>
  <div class="group">
    <label><input type="checkbox" id="hide-foreign"> Hide external</label>
    <label><input type="checkbox" id="only-violations"> Violations only</label>
    <label><input type="checkbox" id="direct-only"> Direct links only</label>
    <label title="Hide A→C when A→B→C exists. Violations and cycles always stay."><input type="checkbox" id="simplify"> Simplify links</label>
    <label title="Hide links backed by fewer dependencies. Violations always stay.">Min links
      <select id="min-count"><option value="auto">auto</option><option>1</option><option>2</option><option>3</option><option>5</option><option>10</option></select></label>
  </div>
  <div class="group">
    <button id="dir" title="Toggle layout direction">↓ Top‑down</button>
    <button id="fit" title="Fit to screen ( f )">Fit</button>
    <button id="png" title="Download PNG">PNG</button>
  </div>
</header>
<main>
  <div id="cy" tabindex="0" aria-label="Dependency graph"></div>
  <aside id="panel">
    <section id="legend"></section>
    <section id="detail"><p class="hint">Click a module to trace what it depends on and what depends on it.
      Double‑click a group to open or close it.</p></section>
  </aside>
</main>
<div id="busy" hidden>Laying out…</div>
<script id="graph-data" type="application/json">{{DATA}}</script>
<script>{{VENDOR}}</script>
<script>{{GRAPH_JS}}</script>
<script>{{APP_JS}}</script>
</body>
</html>
